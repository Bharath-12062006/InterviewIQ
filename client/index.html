<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="InterviewIQ: AI-powered campus placement preparation and interview simulation." />
    <title>InterviewIQ</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('interviewiq_theme');
          if (!theme) {
            var rawSettings = localStorage.getItem('interviewiq_settings');
            if (rawSettings) {
              var parsed = JSON.parse(rawSettings);
              if (parsed && parsed.theme) theme = parsed.theme;
            }
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
